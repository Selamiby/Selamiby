<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="iconGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0A74DA"/>
      <stop offset="100%" stop-color="#00D4AA"/>
    </radialGradient>
    <filter id="iconGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer circle -->
  <circle cx="64" cy="64" r="60" fill="#0A0A1E"/>
  
  <!-- Nexus sphere -->
  <circle cx="64" cy="64" r="48" fill="none" stroke="url(#iconGradient)" stroke-width="2"/>
  
  <!-- Central singularity -->
  <circle cx="64" cy="64" r="12" fill="white" filter="url(#iconGlow)">
    <animate attributeName="r" values="12;14;12" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Orbiting dots -->
  <circle cx="112" cy="64" r="3" fill="#00D4AA">
    <animateTransform attributeName="transform" type="rotate" from="0 64 64" to="360 64 64" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="64" cy="16" r="2" fill="#FF6B9D">
    <animateTransform attributeName="transform" type="rotate" from="0 64 64" to="360 64 64" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
