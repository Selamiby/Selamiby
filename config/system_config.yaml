# config/system_config.yaml
system:
  name: "NEXUS-ONE"
  version: "2.1"
  mode: "development"
  
ai:
  engines:
    local: 
      enabled: true
      model: "llama3.2"
      provider: "ollama"
    cloud:
      enabled: false
      provider: "openai"
      model: "gpt-4"
  
autonomy:
  level: "basic"  # basic, advanced, full
  features:
    file_organization: true
    system_maintenance: true
    backup_management: true
    content_analysis: false
    web_research: false
    
scheduler:
  enabled: true
  tasks:
    - name: "clean_temp_files"
      schedule: "daily"
      time: "03:00"
    - name: "check_disk_space"
      schedule: "hourly"
      
security:
  encryption: false
  logging: true
  audit_trail: true
  
logging:
  level: "INFO"
  file: "data/logs/nexus_system.log"
  max_size_mb: 100
  retention_days: 30
