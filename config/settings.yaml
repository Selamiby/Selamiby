# CPU ve Performans Optimizasyonu Ayarları
performance:
  # CPU Monitoring
  cpu_monitoring: true
  monitor_interval: 1.0  # saniye
  
  # Task Scheduler
  num_workers: 2  # CPU core sayısı
  task_queue_size: 1000
  
  # Cache
  cache_max_size: 500
  cache_ttl: 1800  # 30 dakika
  
  # Bellek Yönetimi
  gc_interval: 300  # 5 dakika
  gc_threshold: 100000
  max_memory_mb: 512
  
# Async İşlemler
async_config:
  batch_size: 10
  batch_delay: 0.01  # saniye
  max_connections: 5
  timeout: 10  # saniye
  rate_limit_calls: 10
  rate_limit_window: 1.0

# Veri İşleme
data_processing:
  stream_chunk_size: 1000
  batch_processor_size: 1000
  text_chunk_size: 512
  text_overlap: 50

# Logging
logging:
  level: INFO
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level: <8} | {message}"
  rotation: "500 MB"
  retention: 10  # gün
  directory: "logs"

# Optimizasyon Terimleri
optimization:
  enable_gc_optimization: true
  enable_memory_pooling: false
  enable_jit_compilation: false  # Windows'ta
  cpu_affinity: false
  
# Ağ Optimizasyonu
network:
  connection_pool_size: 20
  socket_buffer_size: 65536
  tcp_keepalive: true
  compression: false
